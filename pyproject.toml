[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-atlas"
version = "0.1.0"
description = "파이썬 코드베이스의 구조와 호출 관계를 그래프로 보여 주는 로컬 탐색기"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pygls>=2.0",
    "lsprotocol>=2025.0.0",
    "basedpyright>=1.30",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
code-atlas = "code_atlas.cli:main"

[tool.setuptools]
packages = ["code_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
